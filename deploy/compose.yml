# Overlay on the official, commit-pinned Supabase docker-compose.yml.
# All relative paths here use MATCHSHO_ROOT, not the upstream project directory.
name: matchsho
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  studio:
    logging: *logging
  meta:
    logging: *logging
  rest:
    logging: *logging
  realtime:
    logging: *logging
  storage:
    logging: *logging
  imgproxy:
    logging: *logging
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"
    logging: *logging
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
    logging: *logging
  auth:
    environment:
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_HOOK_SEND_SMS_ENABLED: ${PHONE_AUTH_ENABLED:-false}
      GOTRUE_HOOK_SEND_SMS_URI: https://${SITE_HOST}/api/auth/send-sms
      GOTRUE_HOOK_SEND_SMS_SECRETS: ${SUPABASE_SEND_SMS_HOOK_SECRET:-}
    logging: *logging
  functions:
    volumes:
      - ${MATCHSHO_ROOT}/deploy/edge-main:/home/deno/functions/main:ro
      - ${MATCHSHO_ROOT}/supabase/functions/calendar-sync:/home/deno/functions/calendar-sync:ro
      - ${MATCHSHO_ROOT}/supabase/functions/_shared:/home/deno/functions/_shared:ro
    logging: *logging
  db:
    logging: *logging
  web:
    image: ${MATCHSHO_IMAGE:-matchsho-web:local}
    build:
      context: ${MATCHSHO_ROOT}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set site URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set API URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set public key}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    env_file: ${MATCHSHO_ROOT}/deploy/.env.app
    environment:
      # Keep the application's key out of upstream's opaque-key namespace.
      SUPABASE_SECRET_KEY: ${MATCHSHO_SUPABASE_SECRET_KEY:?Set private app service key}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose: ["3000"]
    depends_on:
      api-gw:
        condition: service_healthy
    logging: *logging
  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set site hostname}
      API_HOST: ${API_HOST:?Set API hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate email}
      # Optional workaround for networks that interrupt outbound HTTP/2 to ACME.
      GODEBUG: ${CADDY_GODEBUG:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${MATCHSHO_ROOT}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - matchsho-caddy-data:/data
      - matchsho-caddy-config:/config
    logging: *logging
  scheduler:
    image: ${MATCHSHO_IMAGE:-matchsho-web:local}
    command: ["node", "deploy/scheduler.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set a private cron secret}
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://web:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: *logging
  tools:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ${MATCHSHO_ROOT}/deploy:/workspace/deploy:ro
      - ${MATCHSHO_ROOT}/supabase/migrations:/workspace/supabase/migrations:ro
    env_file: ${MATCHSHO_ROOT}/deploy/.env.app
    entrypoint: ["node", "deploy/migrations.mjs"]
volumes:
  matchsho-caddy-data:
  matchsho-caddy-config:
